<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="324" viewBox="0 0 1000 324" role="img" aria-labelledby="title desc">
<title id="title">Facts first, then the experience</title><desc id="desc">A coherent synthetic match provides events and state. Metrics and evidence support stories; time-aligned tracking drives a visual replay. The fan experience combines them.</desc>
