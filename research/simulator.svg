<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="347" viewBox="0 0 1000 347" role="img" aria-labelledby="title desc">
<title id="title">Synthetic football we can inspect and replay</title><desc id="desc">The measured full run has 90 minutes of actual play, 4K video at 25 fps and 12.71 million player rows. A separate checkpoint test reproduced an original rollout and changed its trajectory after intervention.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#a4bbc9"/></marker></defs>
<rect width="1000" height="347" rx="14" fill="#101e2b"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="28" y="38" font-size="24" fill="#edf5fa" text-anchor="start" font-weight="700">Synthetic football we can inspect and replay</text><text x="28" y="66" font-size="14" fill="#a4bbc9" text-anchor="start" font-weight="400">One AI-vs-AI run · synchronized video and telemetry · measured 2026-10-14</text><rect x="28" y="91" width="300" height="106" rx="12" fill="#73e3ae" fill-opacity=".1" stroke="#73e3ae" stroke-opacity=".6"/><text x="178" y="137" font-size="30" fill="#73e3ae" text-anchor="middle" font-weight="700">90 min</text><text x="178" y="170" font-size="16" fill="#a4bbc9" text-anchor="middle" font-weight="400">Actual play</text><rect x="350" y="91" width="300" height="106" rx="12" fill="#69baff" fill-opacity=".1" stroke="#69baff" stroke-opacity=".6"/><text x="500" y="137" font-size="30" fill="#69baff" text-anchor="middle" font-weight="700">3840 × 2160</text><text x="500" y="170" font-size="16" fill="#a4bbc9" text-anchor="middle" font-weight="400">Video at 25 fps</text><rect x="672" y="91" width="300" height="106" rx="12" fill="#c2a4ff" fill-opacity=".1" stroke="#c2a4ff" stroke-opacity=".6"/><text x="822" y="137" font-size="30" fill="#c2a4ff" text-anchor="middle" font-weight="700">12.71M</text><text x="822" y="170" font-size="16" fill="#a4bbc9" text-anchor="middle" font-weight="400">Player rows</text><rect x="28" y="233" width="275" height="52" rx="12" fill="#73e3ae" fill-opacity=".1" stroke="#73e3ae" stroke-opacity=".6"/><text x="165" y="266" font-size="19" fill="#73e3ae" text-anchor="middle" font-weight="700">Save match state</text><path d="M307 259 L341 259" stroke="#a4bbc9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="350" y="233" width="275" height="52" rx="12" fill="#69baff" fill-opacity=".1" stroke="#69baff" stroke-opacity=".6"/><text x="487" y="266" font-size="19" fill="#69baff" text-anchor="middle" font-weight="700">Change an action</text><path d="M629 259 L663 259" stroke="#a4bbc9" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="672" y="233" width="275" height="52" rx="12" fill="#c2a4ff" fill-opacity=".1" stroke="#c2a4ff" stroke-opacity=".6"/><text x="809" y="266" font-size="19" fill="#c2a4ff" text-anchor="middle" font-weight="700">Compare the replay</text><text x="28" y="321" font-size="14" fill="#a4bbc9" text-anchor="start" font-weight="400">Separate checkpoint test passed. Full-match score 26–8: capture verified; football realism needs work.</text></g></svg>
