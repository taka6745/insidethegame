<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
  <title id="title">Where our prototype could fit</title>
  <desc id="desc">Microsoft supplies the cloud and AI platform. The League has production and fan platforms. A proposed live story desk turns original synthetic match events into checked explanations for producers and personalised viewers. This is a research direction, not a built product.</desc>
  <rect width="1000" height="360" rx="14" fill="#101e2b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="36" font-size="23" font-weight="700" fill="#edf5fa">Build something their product teams could use</text>
    <text x="28" y="63" font-size="13" fill="#a4bbc9">Confirmed partnership context above · Proposed prototype below</text>
    <rect x="28" y="84" width="454" height="85" rx="8" fill="#192d3b"/>
    <rect x="518" y="84" width="454" height="85" rx="8" fill="#192d3b"/>
    <text x="48" y="111" font-size="17" font-weight="700" fill="#69baff">MICROSOFT</text>
    <text x="48" y="138" font-size="15" fill="#edf5fa">Cloud + AI platform, partnership, judging</text>
    <text x="538" y="111" font-size="17" font-weight="700" fill="#73e3ae">PREMIER LEAGUE</text>
    <text x="538" y="138" font-size="15" fill="#edf5fa">Studios + fan products + broadcast partners</text>
    <path d="M255 169v19h245v16M745 169v19H500" fill="none" stroke="#547387" stroke-width="2"/>
    <rect x="28" y="207" width="284" height="101" rx="8" fill="#192d3b"/>
    <rect x="354" y="207" width="292" height="101" rx="8" fill="#27323a" stroke="#f3c678" stroke-width="2"/>
    <rect x="688" y="207" width="284" height="101" rx="8" fill="#192d3b"/>
    <g font-size="17" font-weight="700">
      <text x="48" y="237" fill="#edf5fa">Original match events</text>
      <text x="374" y="237" fill="#f3c678">Live story desk</text>
      <text x="708" y="237" fill="#edf5fa">A useful viewing moment</text>
    </g>
    <g font-size="14" fill="#c6d6e0">
      <text x="48" y="264">Synthetic, replayable, testable</text>
      <text x="48" y="287">A real change or just noise?</text>
      <text x="374" y="264">Explain → check → publish</text>
      <text x="374" y="287">Correct a claim when data changes</text>
      <text x="708" y="264">Producer control + evidence</text>
      <text x="708" y="287">Fan / analyst / language versions</text>
    </g>
    <path d="M319 257h26m-6-5 6 5-6 5M653 257h26m-6-5 6 5-6 5" fill="none" stroke="#a4bbc9" stroke-width="2"/>
    <text x="28" y="338" font-size="12" fill="#a4bbc9">Research proposal · Not built or demand-validated · Test story quality, correction delay, and producer review time</text>
  </g>
</svg>
