<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="382" viewBox="0 0 1000 382" role="img" aria-labelledby="title desc">
<title id="title">Where fans report friction or demand</title><desc id="desc">72% of regular PL viewers say VAR reduces enjoyment. Separately, 32% of US sports fans want personalised highlights; 22% of US entertainment fans say personalised AI recommendations would increase streaming use.</desc>
