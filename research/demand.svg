t x="830" y="173" font-size="34" fill="#73e3ae" text-anchor="middle" font-weight="700">22%</text><text x="830" y="265" font-size="20" fill="#edf5fa" text-anchor="middle" font-weight="700">Would stream more¹</text><text x="830" y="292" font-size="16" fill="#a4bbc9" text-anchor="middle" font-weight="400">US entertainment fans</text><text x="830" y="317" font-size="14" fill="#a4bbc9" text-anchor="middle" font-weight="400">Deloitte · 2026 report</text><text x="28" y="357" font-size="14" fill="#a4bbc9" text-anchor="start" font-weight="400">¹ With more personalised AI recommendations. Intention is not an observed increase in viewing.</text></g></svg>
