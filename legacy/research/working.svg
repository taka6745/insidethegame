<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="248" viewBox="0 0 1000 248" role="img" aria-labelledby="title desc">
<title id="title">How we work in this repo</title><desc id="desc">Inspect and preserve local work, build small reusable code, verify actual output, report evidence and limits. Keep secrets local and preserve data provenance. Examples do not select a product.</desc>
