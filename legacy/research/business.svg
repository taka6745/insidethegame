<title id="title">What they want — and why it matters</title><desc id="desc">Five explicit asks in Microsoft rules section 4.1 connect to fan benefits. All paths end at audience demand: continued viewing, return visits and interest in more matches. These are testable benefits, not established gains.</desc>
