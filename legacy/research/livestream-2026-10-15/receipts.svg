<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc">
  <title id="title">Every answer carries its receipts</title>
  <desc id="desc">Status, cost, evidence ID, chart provenance and limits shown under each answer in the presenter&#x27;s demo.</desc>
  <rect width="1000" height="250" rx="14" fill="#101e2b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="38" font-size="23" font-weight="700" fill="#edf5fa" text-anchor="start">Every answer carries its receipts</text>
    <text x="28" y="64" font-size="13" font-weight="400" fill="#a4bbc9" text-anchor="start">His per-answer footer (slide 22, 40:25) · recorded rehearsal answer on ACA</text>
    <rect x="28" y="88" width="96" height="22" rx="4" fill="#73e3ae"/>
    <text x="76" y="104" font-size="13" font-weight="700" fill="#101e2b" text-anchor="middle">Status</text>
    <text x="140" y="104" font-size="15" font-weight="400" fill="#edf5fa" text-anchor="start">AI narrative: live · Grounded: 4 numbers checked</text>
    <rect x="28" y="118" width="96" height="22" rx="4" fill="#73e3ae"/>
    <text x="76" y="134" font-size="13" font-weight="700" fill="#101e2b" text-anchor="middle">Cost</text>
    <text x="140" y="134" font-size="15" font-weight="400" fill="#edf5fa" text-anchor="start">gpt-6-sol · 6.4 s · 8,308 in / 238 out tokens · est. $0.0068</text>
    <rect x="28" y="148" width="96" height="22" rx="4" fill="#73e3ae"/>
    <text x="76" y="164" font-size="13" font-weight="700" fill="#101e2b" text-anchor="middle">Evidence</text>
    <text x="140" y="164" font-size="15" font-weight="400" fill="#edf5fa" text-anchor="start">An evidence ID per fact, e.g. q6.edition.canada.difference</text>
    <rect x="28" y="178" width="96" height="22" rx="4" fill="#73e3ae"/>
    <text x="76" y="194" font-size="13" font-weight="700" fill="#101e2b" text-anchor="middle">Chart</text>
    <text x="140" y="194" font-size="15" font-weight="400" fill="#edf5fa" text-anchor="start">Built from tool data, never from the model’s text</text>
    <rect x="28" y="208" width="96" height="22" rx="4" fill="#73e3ae"/>
    <text x="76" y="224" font-size="13" font-weight="700" fill="#101e2b" text-anchor="middle">Limits</text>
    <text x="140" y="224" font-size="15" font-weight="400" fill="#edf5fa" text-anchor="start">“What this data can’t tell you” plus the tools’ caveats · copyable trace ID</text>
  </g>
</svg>
