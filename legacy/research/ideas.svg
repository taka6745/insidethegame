<rect width="1000" height="394" rx="14" fill="#101e2b"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="28" y="38" font-size="24" fill="#edf5fa" text-anchor="start" font-weight="700">Different ways to make the match matter</text><text x="28" y="66" font-size="14" fill="#a4bbc9" text-anchor="start" font-weight="400">Four fan jobs · independently challenged design scores /100 · examples only</text><text x="28" y="110" font-size="19" fill="#73e3ae" text-anchor="start" font-weight="700">Together</text><text x="28" y="132" font-size="14" fill="#a4bbc9" text-anchor="start" font-weight="400">Watch with a newcomer</text><rect x="345" y="93" width="550" height="27" rx="4" fill="#263d4c"/><rect x="345" y="93" width="418.0" height="27" rx="4" fill="#73e3ae"/><text x="773.0" y="113" font-size="17" fill="#edf5fa" text-anchor="start" font-weight="700">76</text><text x="28" y="172" font-size="19" fill="#69baff" text-anchor="start" font-weight="700">Race</text><text x="28" y="194" font-size="14" fill="#a4bbc9" text-anchor="start" font-weight="400">Follow your club across matches</text><rect x="345" y="155" width="550" height="27" rx="4" fill="#263d4c"/><rect x="345" y="155" width="396.0" height="27" rx="4" fill="#69baff"/><text x="751.0" y="175" font-size="17" fill="#edf5fa" text-anchor="start" font-weight="700">72</text><text x="28" y="234" font-size="19" fill="#c2a4ff" text-anchor="start" font-weight="700">Suspense</text><text x="28" y="256" font-size="14" fill="#a4bbc9" text-anchor="start" font-weight="400">Catch up without spoilers</text><rect x="345" y="217" width="550" height="27" rx="4" fill="#263d4c"/><rect x="345" y="217" width="374.0" height="27" rx="4" fill="#c2a4ff"/><text x="729.0" y="237" font-size="17" fill="#edf5fa" text-anchor="start" font-weight="700">68</text><text x="28" y="296" font-size="19" fill="#f3c678" text-anchor="start" font-weight="700">Read</text><text x="28" y="318" font-size="14" fill="#a4bbc9" text-anchor="start" font-weight="400">Learn to read the play</text><rect x="345" y="279" width="550" height="27" rx="4" fill="#263d4c"/><rect x="345" y="279" width="352.0" height="27" rx="4" fill="#f3c678"/><text x="707.0" y="299" font-size="17" fill="#edf5fa" text-anchor="start" font-weight="700">64</text><path d="M840.0 80 V318" stroke="#edf5fa" stroke-dasharray="5 5"/><text x="840.0" y="340" font-size="13" fill="#a4bbc9" text-anchor="middle" font-weight="400">90 ambition</text><text x="28" y="370" font-size="14" fill="#a4bbc9" text-anchor="start" font-weight="400">Scores compare designs, not built products. Fan demand and impact still need testing.</text></g></svg>
