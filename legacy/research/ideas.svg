<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="394" viewBox="0 0 1000 394" role="img" aria-labelledby="title desc">
<title id="title">Different ways to make the match matter</title><desc id="desc">Together 76, Race 72, Suspense 68, Read 64. Independently challenged example designs; none reached the 90-point ambition.</desc>
