<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
<title id="title">Inside the Game — live ingestion and storage</title>
<desc id="desc">Recommended architecture. GRF sends events and sampled match state through Azure Event Hubs to a Python ingestion worker on Azure Container Apps. The worker commits current state and historical events together to separate tables in one Azure Database for PostgreSQL server. Original video and full telemetry go to Azure Blob Storage. The Python server and its Uniqueness Engine use PostgreSQL for application queries and insights.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#8eafc5"/></marker>
  <style>
    text { font-family: Arial, Helvetica, sans-serif; fill: #edf5fa; }
    .muted { fill: #aac0d0; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: 1.4px; }
    .heading { font-size: 24px; font-weight: 700; }
    .body { font-size: 18px; }
    .small { font-size: 15px; }
    .box { fill: #142a3a; stroke: #355366; stroke-width: 1.5; }
    .wire { fill: none; stroke: #8eafc5; stroke-width: 2.5; marker-end: url(#arrow); }
  </style>
</defs>
