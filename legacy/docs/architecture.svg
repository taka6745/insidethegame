<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1030" viewBox="0 0 1600 1030" role="img" aria-labelledby="title desc">
  <title id="title">Inside the Game — Microsoft architecture plan</title>
  <desc id="desc">GRF publishes synthetic events and sampled state to Azure Event Hubs. A Container Apps ingestion worker persists facts and current state to PostgreSQL. A Python FastAPI server containing the Uniqueness Engine reads those facts and uses Microsoft Foundry for explanations. A React interface shows the match, statistics and agent. Blob Storage holds full telemetry and video; a separate storage account holds consumer checkpoints. Proposed design, not deployed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#8eafc5"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #edf5fa; }
      .muted { fill: #aac0d0; }
      .label { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; }
      .head { font-size: 23px; font-weight: 700; }
      .body { font-size: 16px; }
      .small { font-size: 14px; }
      .wire { fill: none; stroke: #8eafc5; stroke-width: 2; marker-end: url(#arrow); }
      .box { fill: #142a3a; stroke: #355366; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1600" height="1030" rx="20" fill="#0c1925"/>
  <g>
    <text x="44" y="50" class="label" fill="#69baff">INSIDE THE GAME / ARCHITECTURE</text>
    <text x="44" y="96" font-size="36" font-weight="700">One match. Trusted facts. A personal experience.</text>
    <text x="44" y="130" class="body muted">Microsoft services around the existing GRF simulator and your Python application.</text>
    <rect x="1310" y="28" width="246" height="32" rx="16" fill="#243346"/>
    <text x="1433" y="49" text-anchor="middle" class="small">PROPOSED · 17 OCT 2026</text>

    <rect x="565" y="178" width="650" height="682" rx="18" fill="#102333" stroke="#29465c" stroke-dasharray="6 5"/>
    <text x="585" y="205" class="label muted">BACKEND / AZURE CONTAINER APPS + MANAGED DATA</text>
    <text x="44" y="205" class="label muted">SYNTHETIC MATCH SOURCE</text>
    <text x="1250" y="205" class="label muted">FRONTEND</text>

    <rect x="44" y="240" width="236" height="310" rx="14" class="box"/>
    <rect x="44" y="240" width="236" height="5" rx="2" fill="#73e3ae"/>
    <text x="64" y="282" class="head">GRF engine</text>
    <text x="64" y="313" class="body muted">Existing simulator</text>
    <text x="64" y="354" class="body">Events + tracking</text>
    <text x="64" y="381" class="body">Video + frame map</text>
    <path d="M64 401 H260" stroke="#355366"/>
    <text x="64" y="433" class="body" fill="#73e3ae">Python publisher</text>
    <text x="64" y="461" class="small muted">Recorded replay first</text>
    <text x="64" y="488" class="small muted">Release facts in time order</text>
    <text x="64" y="526" class="small muted">Synthetic label + provenance</text>

    <rect x="325" y="295" width="195" height="155" rx="14" class="box"/>
    <text x="345" y="332" class="small muted">MICROSOFT AZURE</text>
    <text x="345" y="365" class="head" fill="#69baff">Event Hubs</text>
    <text x="345" y="397" class="small muted">Events + sampled state</text>
    <text x="345" y="425" class="small muted">Key = replay stream ID</text>

    <rect x="590" y="240" width="270" height="310" rx="14" class="box"/>
    <rect x="590" y="240" width="270" height="5" rx="2" fill="#69baff"/>
    <text x="610" y="277" class="small muted">CONTAINER APP / WORKER</text>
    <text x="610" y="316" class="head">Ingestion service</text>
    <text x="610" y="356" class="body">Validate + deduplicate</text>
    <text x="610" y="386" class="body">Calculate football facts</text>
    <text x="610" y="416" class="body">Persist events + state</text>
    <path d="M610 444 H840" stroke="#355366"/>
    <text x="610" y="476" class="small muted">Commit before checkpoint</text>
    <text x="610" y="506" class="small muted">Model calls stay off this path</text>

    <rect x="920" y="240" width="270" height="310" rx="14" class="box"/>
    <rect x="920" y="240" width="270" height="5" rx="2" fill="#c2a4ff"/>
    <text x="940" y="277" class="small muted">CONTAINER APP / WEB + API</text>
    <text x="940" y="316" class="head">Python server</text>
    <text x="940" y="348" class="body muted">FastAPI + React assets</text>
    <rect x="938" y="372" width="234" height="51" rx="9" fill="#302f4c" stroke="#9381c0"/>
    <text x="1055" y="404" class="body" text-anchor="middle">Uniqueness Engine</text>
    <text x="940" y="457" class="small muted">Application logic + evidence tools</text>
    <text x="940" y="485" class="small muted">Narration jobs + agent requests</text>
    <text x="940" y="520" class="small muted">HTTPS / snapshots / SSE</text>

    <rect x="1250" y="240" width="306" height="310" rx="14" class="box"/>
    <text x="1270" y="277" class="small muted">REACT + TYPESCRIPT</text>
    <rect x="1268" y="297" width="185" height="229" rx="10" fill="#0c1925" stroke="#3d6177"/>
    <rect x="1278" y="307" width="115" height="29" rx="5" fill="#243f51"/>
    <text x="1335" y="327" text-anchor="middle" class="small">Match info</text>
    <rect x="1278" y="349" width="165" height="115" rx="6" fill="#153b36" stroke="#427568"/>
    <rect x="1290" y="361" width="141" height="91" fill="none" stroke="#52877a"/>
    <path d="M1360 361 V452" stroke="#52877a"/><circle cx="1360" cy="406" r="18" stroke="#52877a" fill="none"/>
    <text x="1360" y="411" class="body" text-anchor="middle">Match</text>
    <rect x="1278" y="477" width="165" height="37" rx="5" fill="#243f51"/>
    <text x="1360" y="501" class="small" text-anchor="middle">Statistics</text>
    <rect x="1465" y="297" width="73" height="229" rx="10" fill="#302f4c" stroke="#9381c0"/>
    <text x="1501" y="410" class="body" text-anchor="middle">Agent</text>

    <path d="M280 370 H325" class="wire"/>
    <path d="M520 370 H590" class="wire"/>
    <path d="M1190 365 H1250" class="wire"/>
    <path d="M1250 413 H1190" class="wire"/>

    <rect x="590" y="650" width="270" height="185" rx="14" class="box"/>
    <text x="610" y="684" class="small muted">AZURE DATABASE FOR</text>
    <text x="610" y="717" class="head" fill="#69baff">PostgreSQL</text>
    <text x="610" y="750" class="body">Game state + stats</text>
    <text x="610" y="778" class="body">Events + insights + jobs</text>
    <text x="610" y="812" class="small muted">One database; separate tables</text>
    <path d="M725 550 V650" class="wire"/>
    <text x="740" y="600" class="small muted">Facts</text>
    <path d="M860 718 H892 V458 H920" class="wire"/>
    <path d="M920 493 H908 V785 H860" class="wire"/>
    <text x="888" y="633" class="small muted" transform="rotate(-90 888 633)">Read facts / save insights</text>

    <rect x="920" y="650" width="270" height="185" rx="14" class="box"/>
    <text x="940" y="687" class="head" fill="#c2a4ff">Microsoft Foundry</text>
    <text x="940" y="720" class="body">Agent Service</text>
    <text x="940" y="755" class="body">Explain + personalise</text>
    <text x="940" y="784" class="body">Chat + match recaps</text>
    <text x="940" y="813" class="small muted">Grounded in application tools</text>
    <path d="M1032 550 V650" class="wire"/>
    <path d="M1076 650 V550" class="wire"/>
    <text x="1090" y="604" class="small muted">Tools + AI</text>

    <rect x="44" y="650" width="476" height="185" rx="14" class="box"/>
    <text x="64" y="687" class="head" fill="#73e3ae">Azure Blob Storage</text>
    <text x="64" y="723" class="body">Match assets: video + full telemetry</text>
    <text x="64" y="752" class="body">Frame map + simulator snapshots</text>
    <path d="M64 771 H500" stroke="#355366"/>
    <text x="64" y="805" class="small muted">Separate account: Event Hubs consumer checkpoints</text>
    <path d="M162 550 V650" class="wire"/>
    <text x="176" y="604" class="small muted">Original assets</text>
    <path d="M590 509 H555 V801 H520" class="wire" stroke-dasharray="5 4"/>
    <path d="M282 835 V884 H1230 V580 H1403 V550" class="wire"/>
    <rect x="592" y="869" width="384" height="29" rx="6" fill="#0c1925"/>
    <text x="784" y="889" class="small muted" text-anchor="middle">Video + frame mapping → browser playback</text>

    <rect x="1250" y="650" width="306" height="185" rx="14" fill="#122a2c" stroke="#365e57"/>
    <text x="1270" y="686" class="head" fill="#73e3ae">Same facts, different fans</text>
    <text x="1270" y="724" class="body">Casual / analyst depth</text>
    <text x="1270" y="754" class="body">Club / player focus</text>
    <text x="1270" y="784" class="body">Language + timed explanations</text>
    <text x="1270" y="814" class="small muted">One shared playback cursor</text>

    <path d="M44 929 H1556" stroke="#29465c"/>
    <text x="44" y="961" class="label muted">CROSS-CUTTING MICROSOFT SERVICES</text>
    <text x="44" y="992" class="body">Managed identities / Entra ID</text>
    <text x="445" y="992" class="body">Azure Monitor + Application Insights</text>
    <text x="970" y="992" class="body">Azure Container Registry</text>
    <text x="1556" y="992" text-anchor="end" class="small muted">Two app deployments</text>
  </g>
</svg>
