# Local ETL stack: SQL Server (stands in for Azure SQL) and Data API builder.
# Start with `python -m etltools.dev local-up`, which writes .env and applies migrations.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${LOCAL_SA_PASSWORD:?run python -m etltools.dev local-up}
    ports: ["14330:1433"]
    volumes: [sqldata:/var/opt/mssql]

  dab:
    image: mcr.microsoft.com/azure-databases/data-api-builder:2.1.5
    depends_on: [sql]
    environment:
      DATABASE_CONNECTION_STRING: "Server=sql;Database=insidethegame;User Id=sa;Password=${LOCAL_SA_PASSWORD};TrustServerCertificate=true"
    ports: ["5000:5000"]
    volumes: ["./dab/dab-config.json:/App/dab-config.json:ro"]

volumes:
  sqldata:
