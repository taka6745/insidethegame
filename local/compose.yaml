name: itg-local

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: itg
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: accounts
    ports: ["127.0.0.1:15432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U itg -d accounts"]
      interval: 3s
      timeout: 3s
      retries: 30

  cosmos:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest@sha256:0bd6dbab98295718c85399ad27c38d45733060086528711594a7d52bafcb3447
    environment:
      PROTOCOL: http
      ENABLE_EXPLORER: "true"
    ports: ["127.0.0.1:18081:8081", "127.0.0.1:11234:1234"]

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0@sha256:647c63a91102a9d8e8000aab803436e1fc85fbb285e7ce830a82ee5d6661cf37
    profiles: [azure]
    # Private dependency of Event Hubs; no host ports needed.

  eventhubs:
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest@sha256:be413f0d59541621879e6d197d73f64f3b3ac5fa45861641fdc1430252b8b44b
    profiles: [azure]
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
    volumes:
      - ./config/eventhubs.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    ports: ["127.0.0.1:15672:5672", "127.0.0.1:15300:5300"]
    depends_on: [azurite]

  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    platform: linux/amd64
    profiles: [azure]
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: Local-Only-Password-42!
      MSSQL_MEMORY_LIMIT_MB: "2048"
    ports: ["127.0.0.1:11433:1433"]
    volumes: ["sql-data:/var/opt/mssql"]
    healthcheck:
      test: [CMD-SHELL, '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" -b -o /dev/null']
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  servicebus:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest@sha256:5a96d893b245031740f7d46e0fe5ff282d24b78c4b7d761dd57590f3f010a9b3
    profiles: [azure]
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-N}
      SQL_SERVER: sql
      MSSQL_SA_PASSWORD: Local-Only-Password-42!
      SQL_WAIT_INTERVAL: "15"
      EMULATOR_HTTP_PORT: "5300"
    volumes:
      - ./config/servicebus.json:/ServiceBus_Emulator/ConfigFiles/Config.json:ro
    ports: ["127.0.0.1:15673:5672", "127.0.0.1:15301:5300"]
    depends_on:
      sql: {condition: service_healthy}

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:cf8f0ab2ebe61feec2eed2629061a07d247f791c2a8ddda74a4ac9f06a291718
    platform: linux/amd64
    profiles: [azure]
    environment:
      SQLCMDPASSWORD: Local-Only-Password-42!
    volumes: ["./sql/match.sql:/init.sql:ro"]
    entrypoint: [/opt/mssql-tools18/bin/sqlcmd]
    command: [-S, sql, -U, sa, -C, -b, -i, /init.sql]
    depends_on:
      sql: {condition: service_healthy}

  graphql:
    image: mcr.microsoft.com/azure-databases/data-api-builder:1.6.87@sha256:13bbc00893dc1aa120af067a895a88d76f8a3b440f3efa5a56c07d727f75454a
    platform: linux/amd64
    profiles: [azure]
    environment:
      SQL_CONNECTION_STRING: "Server=sql;Database=matchdata;User ID=sa;Password=Local-Only-Password-42!;TrustServerCertificate=true"
    volumes: ["./config/dab.json:/App/dab-config.json:ro"]
    ports: ["127.0.0.1:15000:5000"]
    depends_on:
      sql-init: {condition: service_completed_successfully}

  tools:
    build: .
    profiles: [tools]
    working_dir: /workspace
    volumes: ["../:/workspace:ro"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    # Tooling only: no credentials for real Azure and no Docker socket.

  backend:
    build: {context: ../user-backend, target: runtime}
    profiles: [backend]
    ports: ["127.0.0.1:18000:8000"]
    env_file:
      - path: ../.local/backend-llm.env
        required: false
    environment: &backend-env
      AGENT_MAX_REPAIRS: ${AGENT_MAX_REPAIRS:-3}
      AGENT_PLAN_TIMEOUT_SECONDS: ${AGENT_PLAN_TIMEOUT_SECONDS:-60}
      BACKEND_MODE: fixture
      ENABLE_DEV_FEED: "1"
      ENABLE_FILTER_LAB: "1"
      ACCOUNTS_DATABASE_URL: postgresql://itg:local-development-only@postgres:5432/accounts
      MATCH_APP_DATABASE_URL: postgresql://itg:local-development-only@postgres:5432/matchapp
      ETL_GRAPHQL_URL: http://fake-etl:8000/graphql
      NARRATIVE_GRAPHQL_URL: http://fake-narrative:8000/graphql
    depends_on:
      postgres: {condition: service_healthy}
      fake-etl: {condition: service_healthy}
      fake-narrative: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 20

  fake-etl:
    build: {context: ../user-backend, target: runtime}
    profiles: [backend]
    command: [uvicorn, "backend.fakes:from_env", --factory, --host, "0.0.0.0", --port, "8000"]
    environment:
      FAKE_ROLE: etl
      BACKEND_NOTIFY_URL: http://backend:8000
    ports: ["127.0.0.1:18010:8000"]
    healthcheck: &fake-health
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 3s
      timeout: 6s
      retries: 20

  fake-narrative:
    build: {context: ../user-backend, target: runtime}
    profiles: [backend]
    command: [uvicorn, "backend.fakes:from_env", --factory, --host, "0.0.0.0", --port, "8000"]
    environment:
      FAKE_ROLE: narrative
      BACKEND_NOTIFY_URL: http://backend:8000
    ports: ["127.0.0.1:18011:8000"]
    healthcheck: *fake-health

  backend-tests:
    build: {context: ../user-backend, target: test}
    profiles: [tools]
    environment: *backend-env

  frontend:
    build: ../frontend
    profiles: [backend]
    ports: ["127.0.0.1:18020:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  sql-data:
