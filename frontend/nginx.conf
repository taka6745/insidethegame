map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $uri $cache_policy {
    default "no-cache";
    ~^/(?:viewer-api|api)/ "no-store";
    ~^/app/[0-9a-f]+/ "public, max-age=31536000, immutable";
    # Live and replay playlists change; published segments never do.
    ~^/media/hls/.*\.m3u8$ "no-cache";
    ~^/media/hls/ "public, max-age=31536000, immutable";
}
# Resolved at startup from deployment settings; Docker defaults live in the image.
upstream match_backend {
    zone match_backend 64k;
    resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 2s;
    server ${BACKEND_UPSTREAM} resolve;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    add_header Cache-Control $cache_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' blob:; media-src 'self' blob:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;

    location /viewer-api/ {
        proxy_pass http://match_backend/product/;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host ${BACKEND_UPSTREAM};
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 70s;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://match_backend/lab/;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_read_timeout 180s;
        proxy_set_header Host ${BACKEND_UPSTREAM};
        proxy_set_header X-Forwarded-Host $host;
    }
    # Cache policy comes from the map, so server-level security headers still apply.
    location /media/hls/ {
        types { application/vnd.apple.mpegurl m3u8; video/mp2t ts; }
        try_files $uri =404;
    }
    location = / {
        try_files /index.html =404;
    }
    location ~* \.(?:js|css|svg)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/vnd.apple.mpegurl;
    gzip_min_length 512;
}
