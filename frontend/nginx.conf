map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $uri $cache_policy {
    default "no-cache";
    ~^/(?:viewer-api|api|dev-api|feed-api|purge-api|demo-api)/ "no-store";
    ~^/app/[0-9a-f]+/ "public, max-age=31536000, immutable";
    # Live and replay playlists change; published segments never do.
    ~^/media/hls/.*\.m3u8$ "no-cache";
    ~^/media/hls/ "public, max-age=31536000, immutable";
}
# Resolved at startup from deployment settings; Docker defaults live in the image.
upstream match_backend {
    zone match_backend 64k;
    resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 2s;
    server ${BACKEND_UPSTREAM} resolve;
}
# The match feed is an external provider: its HLS origin is proxied like a CDN would.
upstream media_origin {
    zone media_origin 64k;
    resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 2s;
    server ${MEDIA_ORIGIN} resolve;
}
# Developer-only consoles (ENABLE_DEV_ADMIN=1): the feed's admin API and each owner's purge.
upstream feed_admin {
    zone feed_admin 64k;
    resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 2s;
    server ${FEED_ADMIN_UPSTREAM} resolve;
}
# The demo operator (local/demo_control.py serve): purges and starts runs for the public demo controls.
upstream demo_control {
    zone demo_control 64k;
    resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 2s;
    server ${DEMO_CONTROL_UPSTREAM} resolve;
}
upstream etl_admin {
    zone etl_admin 64k;
    resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 2s;
    server ${ETL_ADMIN_UPSTREAM} resolve;
}
upstream engine_admin {
    zone engine_admin 64k;
    resolver ${NGINX_RESOLVER} valid=5s ipv6=off;
    resolver_timeout 2s;
    server ${ENGINE_ADMIN_UPSTREAM} resolve;
}
# Public demo control limits. Start and cancel are shared by every viewer (one key), so a loop of them
# can't churn runs; reads are per client. The client is the LAST X-Forwarded-For entry: the Azure ingress
# appends the address it saw, so a value the client sends itself only ever comes earlier and cannot pick the key.
# Behind the edge proxy (edge-proxy/) that address is a Cloudflare edge node. Without the header: the peer.
map $host $demo_everyone {
    default "demo";
}
map $http_x_forwarded_for $demo_client {
    "~(?:^|,)\s*(?<last_hop>[^,\s]+)\s*$" $last_hop;
    default $binary_remote_addr;
}
limit_req_zone $demo_everyone zone=demo_write:64k rate=10r/m;
# Reads (state/status) are cheap; behind the Cloudflare edge every viewer in a city shares one client key, and
# behind Container Apps' ingress without it all viewers would, so the limit must carry a room of viewers polling at
# about 2/s each (a 5/s limit made demos fail for the second and third viewer).
limit_req_zone $demo_client zone=demo_read:1m rate=40r/s;
map "${ENABLE_DEV_ADMIN}" $dev_admin {
    default 0;
    "1" 1;
}
# ENABLE_DEMO_CONTROL=0 (a production release): /demo-api/ is 404 and the viewer shows no demo controls.
map "${ENABLE_DEMO_CONTROL}" $demo_control {
    default 0;
    "1" 1;
}
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 16m;
    add_header Cache-Control $cache_policy always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; media-src 'self' blob:; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;

    location /viewer-api/ {
        proxy_pass http://match_backend/product/;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host ${BACKEND_UPSTREAM};
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout ${QUESTION_PROXY_TIMEOUT}s;  # the backend's QUESTION_TIMEOUT_SECONDS + 10
        proxy_buffering off;
    }
    # Developer filter lab; the backend serves /lab/ only when ENABLE_FILTER_LAB=1.
    location /api/ {
        if ($dev_admin != "1") { return 404; }
        proxy_pass http://match_backend/lab/;
        include /etc/nginx/dev-admin-auth.conf;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_read_timeout ${QUESTION_PROXY_TIMEOUT}s;
        proxy_set_header Host ${BACKEND_UPSTREAM};
        proxy_set_header X-Forwarded-Host $host;
    }
    # Local developer config; the backend serves /dev/ only when ENABLE_DEV_FEED=1.
    location /dev-api/ {
        if ($dev_admin != "1") { return 404; }
        proxy_pass http://match_backend/dev/;
        include /etc/nginx/dev-admin-auth.conf;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_set_header Host ${BACKEND_UPSTREAM};
        proxy_set_header X-Forwarded-Host $host;
    }
    # Developer consoles; 404 unless ENABLE_DEV_ADMIN=1. The viewer and lab never call them.
    # The browser's basic-auth header never reaches an upstream.
    location /feed-api/ {
        if ($dev_admin != "1") { return 404; }
        proxy_pass http://feed_admin/;
        include /etc/nginx/dev-admin-auth.conf;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_set_header Host ${FEED_ADMIN_UPSTREAM};
    }
    # Public demo control: start the configured demo, cancel it, read its state and each stage's readiness. Idempotent; the feed
    # caps concurrent runs, so repeated clicks from several viewers start one demo.
    # Named captures: the rate-limit key map runs its own regex when limit_req evaluates it, which resets $1.
    location ~ "^/demo-api/(?<demo_write_op>start|cancel|skip)$" {
        if ($demo_control != "1") { return 404; }
        limit_except POST { deny all; }
        limit_req zone=demo_write burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://demo_control/$demo_write_op;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        # Start and cancel answer at once (202) and run in the operator; /state reports the outcome. This only
        # covers waking the operator and the feed from zero (WAKE_TIMEOUT 60 s in local/demo_control.py).
        proxy_read_timeout 90s;
        proxy_set_header Host ${DEMO_CONTROL_UPSTREAM};
    }
    location ~ "^/demo-api/(?<demo_read_op>state|status)$" {
        if ($demo_control != "1") { return 404; }
        limit_except GET { deny all; }
        limit_req zone=demo_read burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://demo_control/$demo_read_op;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host ${DEMO_CONTROL_UPSTREAM};
    }
    location = /purge-api/etl {
        if ($dev_admin != "1") { return 404; }
        limit_except POST { deny all; }
        proxy_pass http://etl_admin/admin/matches/purge;
        include /etc/nginx/dev-admin-auth.conf;
        include /etc/nginx/etl-admin-token.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host ${ETL_ADMIN_UPSTREAM};
    }
    location = /purge-api/engine {
        if ($dev_admin != "1") { return 404; }
        limit_except POST { deny all; }
        proxy_pass http://engine_admin/admin/matches/purge;
        include /etc/nginx/dev-admin-auth.conf;
        include /etc/nginx/engine-admin-token.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host ${ENGINE_ADMIN_UPSTREAM};
    }
    location = /purge-api/backend {
        if ($dev_admin != "1") { return 404; }
        limit_except POST { deny all; }
        proxy_pass http://match_backend/admin/matches/purge;
        include /etc/nginx/dev-admin-auth.conf;
        proxy_set_header Authorization "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_set_header Host ${BACKEND_UPSTREAM};
    }
    # Per-match live HLS: only a playlist or segment directly under /media/hls/{matchId}/, from the
    # feed's origin, which lists only what has played. Cache policy comes from the map.
    location ~ "^/media/hls/([a-z0-9][a-z0-9-]{0,63})/([A-Za-z0-9_-]{1,64}\.(?:m3u8|ts))$" {
        proxy_pass http://media_origin/hls/$1/$2;
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_read_timeout 20s;
        proxy_set_header Host ${MEDIA_ORIGIN};
        proxy_hide_header Cache-Control;
        proxy_hide_header Set-Cookie;
        proxy_ignore_headers Set-Cookie;
    }
    # No other media (e.g. a full-match file or a directory listing) is ever served.
    location /media/ {
        return 404;
    }
    # The /dev/ console and /lab/ pages; ^~ so the asset rule below cannot bypass the gate.
    location ^~ /dev/ {
        if ($dev_admin != "1") { return 404; }
        include /etc/nginx/dev-admin-auth.conf;
        try_files $uri $uri/ =404;
    }
    location ^~ /lab/ {
        if ($dev_admin != "1") { return 404; }
        include /etc/nginx/dev-admin-auth.conf;
        try_files $uri $uri/ =404;
    }
    location = / {
        try_files /index.html =404;
    }
    # Fingerprinted viewer assets; an old fingerprint (a tab opened before a deploy) gets the current build's file,
    # served no-cache (its $uri is no longer fingerprinted), rather than a 404 that only a hard refresh cured.
    location ~ "^/app/[0-9a-f]+/(?<app_file>[A-Za-z0-9_./-]+)$" {
        try_files $uri /app/current/$app_file =404;
    }
    location ~* \.(?:js|css|svg)$ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ =404;
    }
    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/vnd.apple.mpegurl;
    gzip_min_length 512;
}
