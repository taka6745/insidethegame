name: Test football exporter

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/GoogleResearchFootball/**'
      - '.github/workflows/football.yml'
  pull_request:
    paths:
      - 'data/GoogleResearchFootball/**'
      - '.github/workflows/football.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build pinned engine and telemetry patch
        run: docker build -t insidethegame-grf:research data/GoogleResearchFootball
      - name: Check event definitions and native coordinates
        run: |
          docker run --rm --network none \
            -v "$PWD/data/GoogleResearchFootball:/work:ro" \
            insidethegame-grf:research -m unittest -v test_events test_engine
      - name: Export a short match and test checkpoint branching
        env:
          GRF_RUN_NAME: ci
        run: data/GoogleResearchFootball/run.sh --games 1 --max-steps 50
      - name: Verify exported data
        run: python3 data/GoogleResearchFootball/verify.py .local/grf-runs/ci
      - uses: actions/upload-artifact@v4
        with:
          name: football-smoke-export
          path: .local/grf-runs/ci/
          include-hidden-files: true
          retention-days: 7
