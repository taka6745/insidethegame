name: Refresh competitors

on:
  workflow_dispatch:
    inputs:
      repos_only:
        description: Keep the project export and refresh GitHub metrics only
        type: boolean
        default: false
  schedule:
    # 22:00 UTC = 08:00 Brisbane on the following day, 13–28 October.
    # schedule_window.py also checks the year to prevent annual reruns.
    - cron: '0 22 12-27 10 *'

permissions:
  contents: read

concurrency:
  group: competitors-refresh
  cancel-in-progress: false

jobs:
  window:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.window.outputs.active }}
    steps:
      - uses: actions/checkout@v4
      - id: window
        run: python3 .github/scripts/schedule_window.py

  refresh:
    needs: window
    if: needs.window.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test refresh and report logic
        run: python3 -m unittest discover -s .github/scripts -p "test_*.py" -v
      - name: Refresh projects, inspect repositories, generate reports
        id: refresh
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          INNOVATION_SEARCH_CURL: ${{ secrets.INNOVATION_SEARCH_CURL }}
          INNOVATION_DETAIL_CURL: ${{ secrets.INNOVATION_DETAIL_CURL }}
          REPOS_ONLY: ${{ inputs.repos_only }}
        run: |
          if [ "$REPOS_ONLY" = "true" ]; then
            python3 .github/scripts/refresh.py --repos-only
          else
            python3 .github/scripts/refresh.py
          fi
      - name: Verify generated report
        id: verify
        if: always() && !cancelled()
        run: python3 .github/scripts/verify_report.py
      - name: Save updated report
        if: always() && !cancelled() && steps.verify.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add competitors/
          if ! git diff --cached --quiet; then
            git commit -m "Refresh competitor data and graphics"
            git push
          fi
      - name: Job summary
        if: always() && !cancelled()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=json.loads(Path('competitors/data/snapshot.json').read_text())
          m=json.loads(Path('competitors/data/metrics.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write(f"Projects: **{m['projects']}** · Linked: **{m['linked_projects']}**\n\n")
              f.write(f"Project export: {p['exported_at']} · Refresh: **{p['refresh_status']}**\n\n")
              f.write(f"GitHub audit: {m['github_checked_at']}\n\n")
              f.write("Scheduled at 8 am Brisbane through 28 October 2026.\n")
          PY
      - name: Report refresh failure
        if: steps.refresh.outcome == 'failure'
        run: |
          echo "Refresh failed. The report marks its last successful export; check session expiry or the audit logs."
          exit 1
