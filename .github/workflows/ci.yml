name: CI

# Unit and integration tests for every active service. No cloud calls and no model calls:
# agent paths run against fixture doubles; the backend uses a throwaway local PostgreSQL.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Data generation
        run: |
          pip install pytest
          cd data-generation && python -m pytest -q
      - name: Narrative engine
        run: |
          pip install -r narrative-engine/requirements-dev.txt
          cd narrative-engine && python -m pytest -q

  feed:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: feed, POSTGRES_PASSWORD: ci-only, POSTGRES_DB: feed_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U feed" --health-interval 3s --health-retries 20
      azurite:  # Blob Storage mode (Azure)
        image: mcr.microsoft.com/azure-storage/azurite:3.35.0
        ports: ["10000:10000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r data-generation/feed/requirements-test.txt
      - name: Feed (unit + Postgres repository + Blob Storage)
        working-directory: data-generation
        env:
          FEED_TEST_DATABASE_URL: "postgresql://feed:ci-only@localhost:5432/feed_test"
          # Azurite's published development account, not a secret.
          FEED_TEST_BLOB_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:10000/devstoreaccount1;"
        run: python -m pytest -q feed
      - name: Demo control (fake feed and owners)
        working-directory: local
        run: python -m pytest -q test_demo_control.py

  etl:
    runs-on: ubuntu-latest
    # SQL Server Developer for the migrations, local stream worker and statsAtSeq tests (each run
    # creates and drops its own databases). Running it accepts the SQL Server licence terms.
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2025-CU9-ubuntu-24.04  # as etl/docker-compose.yml
        env: {ACCEPT_EULA: "Y", MSSQL_PID: Developer, MSSQL_SA_PASSWORD: "Ci-Only-Password-42!"}
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Ci-Only-Password-42!' -C -Q 'SELECT 1' -b"
          --health-interval 5s --health-retries 40 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r etl/requirements-test.txt
      - name: ETL (reference rules, catalogue, local stream, SQL)
        working-directory: etl
        env: {ETL_TEST_SQL_PASSWORD: "Ci-Only-Password-42!"}
        run: python -m pytest -q

  backend:
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose --env-file local/env.defaults -f local/compose.yaml
    steps:
      - uses: actions/checkout@v4
      - run: $COMPOSE up -d --wait postgres
      - run: $COMPOSE run --rm --build --no-deps backend-tests
      - if: always()
        run: $COMPOSE down -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: {working-directory: frontend}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p .
      - name: Stream Analytics UDFs match their TypeScript sources
        run: node ../etl/stream-analytics/udfs/build.ts --check
      - run: npm test
      - run: npm run build
      # The deny-list itself is private: set the BUNDLE_DENYLIST repository secret to enable the scan.
      - name: Bundle deny-list scan
        env: {BUNDLE_DENYLIST: "${{ secrets.BUNDLE_DENYLIST }}"}
        run: if [ -n "$BUNDLE_DENYLIST" ]; then npm run check:bundle; else echo "BUNDLE_DENYLIST not set; skipped"; fi

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./dev terraform check
